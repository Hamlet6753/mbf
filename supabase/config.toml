# MBF development configuration. No production config is pushed from this file.
project_id = "mbf-dev"

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback", "http://localhost:3000/auth/callback?next=/auth/reset-password", "http://127.0.0.1:3000/auth/callback?next=/auth/reset-password"]

[auth.email]
enable_confirmations = true
otp_expiry = 1800

[remotes.dev]
project_id = "gawblqkuodzuerzirsyr"
