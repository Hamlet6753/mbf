name: Validate MBF
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:env
      - run: npm run lint
      - run: npm run build:dev
# Validation only. This workflow never deploys or migrates a Supabase project.
